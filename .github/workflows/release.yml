# =============================================================================
# Build and Release — triggered when a v* tag is pushed, or manually.
#
# Notes:
#   * GitHub only reads workflows from the repository ROOT (.github/workflows),
#     not from a subfolder. The whole project lives under `app/`, so all run
#     steps use `defaults.run.working-directory: app`.
#   * The build version is taken from the git tag (vX.Y.Z) and synced into
#     package.json / tauri.conf.json / Cargo.toml before building, so the
#     produced installer version always matches the tag.
#   * Windows -> MSI installer. macOS -> DMG (unsigned; see the signing notes
#     in the macOS job if you want a Gatekeeper-clean release).
# =============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'            # e.g. v0.2.0 — one run per tag.
  workflow_dispatch:    # manual trigger from the Actions tab.

# Cancel a still-running build if a newer tag/manual run is pushed.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write       # required to create the release + upload assets.

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app

jobs:

  # ── Build (Windows x64) ─────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from git tag
        run: node ${{ github.workspace }}/.github/scripts/sync-version.mjs

      - name: Run Rust unit tests
        run: cargo test
        working-directory: app/src-tauri

      - name: Build Tauri application (MSI)
        run: pnpm tbuild --bundles msi

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsTerminal-Windows
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ── Build (macOS ARM64) ────────────────────────────────────────────────
  # NOTE: the produced DMG is unsigned. For a Gatekeeper-clean release,
  # add APPLE_* signing secrets and pass `-- --config bundle.macOS.signingIdentity`
  # to `tauri build`. Remove this job entirely if you only ship Windows.
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from git tag
        run: node ${{ github.workspace }}/.github/scripts/sync-version.mjs

      - name: Run Rust unit tests
        run: cargo test
        working-directory: app/src-tauri

      - name: Build Tauri application (DMG)
        run: pnpm tbuild --bundles dmg

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsTerminal-macOS
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Release (after all builds succeed) ─────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: OopsTerminal-Windows
          path: dist/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: OopsTerminal-macOS
          path: dist/macos

      - name: List release assets
        run: ls -lhR dist
        working-directory: ${{ github.workspace }}

      # 发布正文取自仓库根目录 CHANGELOG.md:先运行脚本把当前版本对应的章节
      # 提取到临时文件,再用 body_path 指定。每次发版只需在 CHANGELOG.md 顶部
      # 「## [Unreleased]」下新增当前版本的记录。
      - name: Generate release body from CHANGELOG.md
        run: node ${{ github.workspace }}/.github/scripts/release-body.mjs ${{ github.ref_name }} ${{ github.workspace }}/release_body.md
        working-directory: ${{ github.workspace }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/windows/*.msi
            dist/macos/*.dmg
          body_path: ${{ github.workspace }}/release_body.md
          make_latest: true
          fail_on_unmatched_files: false
